# ---------------------------------------------------------------------------
# This file supplies defaults. Anything set as a real environment variable
# (or in .env) takes precedence over the values here.
# ---------------------------------------------------------------------------

# Backend type. "openrouter" enables generation cost accounting.
type: openrouter

# Model configuration
model: deepseek/deepseek-r1:free
base_url: https://openrouter.ai/api/v1
temperature: 0.7
top_p: 0.7
frequency_penalty: 0
presence_penalty: 0

# Response configuration
max_tokens: 2000

# Maximum length of one outgoing answer. Telegram allows 4096 characters per
# message, so anything close to that risks a rejected message; 3500 keeps a
# safety margin and matches what the assistant is told to produce.
max_reply_chars: 3500

# Render final answers as Markdown, so headings, bullets, tables and code
# blocks come out the way the model wrote them. Telegram rejects a message
# whose markup does not parse, so the renderer falls back to legacy Markdown
# and then to plain text: nothing is ever lost.
render_markdown: true

# Occasionally suggest a model that suits the user's usage better.
suggest_models: true

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------

# Telegram user ID of admins (the bot owner), or empty to assign no admin.
# An owner can always use the bot, in private chats and in every group.
admin_ids: ""

# Allowed USER IDs. Leave empty to treat everyone as USER.
allowed_user_ids: ""

# Budget configuration, in USD per budget_period
user_budget: 1
guest_budget: 0

# Budget period: daily, monthly, total
budget_period: monthly

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------

# Language of the bot's own messages (supported: EN, RU) and of the answers.
lang: EN

# Minimum role to show spend statistics (ADMIN, USER, GUEST)
stats_min_role: ADMIN

# PUBLIC_MODE removes every usage restriction at once: unlimited budget for
# all roles, no rate limiting, answers to every group message and open direct
# messages.
public_mode: true

# Who may use the bot in a direct message:
#   everyone - anybody who finds it (default, right for a public bot)
#   admins   - only the bot owner; there are no other admins in a private chat
#   owner    - the same, spelled out for a personal assistant
# PUBLIC_MODE forces everyone. A stranger who writes to a restricted bot gets
# one short explanation instead of silence.
private_access: everyone

# Who may use the bot in a group before anyone runs /group:
#   everyone - any member (default, right for a free public bot)
#   admins   - only chat administrators and the owner
#   owner    - only the bot owner
# A group can override this at any time with /group. The buttons in the bot
# also change it, no command needed.
group_access: everyone

# How the bot behaves in group chats:
#   mention - answer only when mentioned or replied to
#   all     - answer every group message
#   off     - never answer in groups
group_chat_mode: mention

# Max AI requests per user per minute (0 disables rate limiting)
rate_limit_per_minute: 10

# Max AI requests running at the same time
max_concurrent_requests: 8

# Total timeout for one request, including streaming (seconds)
request_timeout_seconds: 300

# Abort a stream that delivers nothing for this long (seconds)
stream_idle_timeout_seconds: 120

# ---------------------------------------------------------------------------
# Conversation history
# ---------------------------------------------------------------------------

max_history_size: 10
max_history_time: 60
max_context_messages: 12
max_context_tokens: 6000
summary_threshold: 8
max_agent_steps: 4
max_file_size: 10485760
storage_type: json

# ---------------------------------------------------------------------------
# Provider chain
# ---------------------------------------------------------------------------
#
# Requests walk this list top to bottom. When a model fails the next model of
# the same provider is tried; when a provider fails the next provider is
# tried - at stream creation and mid-stream. A user can override the order
# from the buttons (/model), and the bot falls back automatically.
#
# A provider only needs a name: the built-in preset supplies the endpoint, the
# models and the name of the environment variable holding the key. Everything
# may be overridden per entry.
#
# A provider whose key is missing is listed by /providers and the model picker
# (marked "no key") but never costs a request - nothing has to be commented
# out when a key is absent.
#
# Built-in presets: openrouter, groq, gemini, cerebras, nvidia, mistral,
# deepseek, together, ollama, lmstudio.
#
# Remove this block entirely to fall back to the flat BASE_URL/MODEL/API_KEY
# variables plus every preset whose key is set in the environment.

providers:
  # OpenRouter: https://openrouter.ai/settings/keys  (API_KEY)
  # Models are loaded from the live OpenRouter catalogue; MODEL is the
  # cold-start fallback if catalogue discovery is temporarily unavailable.
  - name: openrouter

  # Groq: fast and free, the best default for a busy public bot.
  # Key: GROQ_API_KEY from https://console.groq.com/keys
  - name: groq

  # Google Gemini: 1M token context and vision.
  # Key: GEMINI_API_KEY from https://aistudio.google.com/apikey
  - name: gemini

  # Cerebras, NVIDIA NIM, Mistral, Hugging Face, DeepSeek and Together all
  # work the same way - add the name and set the matching key.
  # Key: CEREBRAS_API_KEY from https://cloud.cerebras.ai
  - name: cerebras
  # NVIDIA NIM: the hosted model catalogue, with a free tier.
  # Key: NVIDIA_API_KEY from https://build.nvidia.com
  - name: nvidia
  # Key: MISTRAL_API_KEY from https://console.mistral.ai
  - name: mistral
  # Hugging Face inference providers: one token, hundreds of open models.
  # Key: HF_TOKEN from https://huggingface.co/settings/tokens
  - name: huggingface
  # Key: DEEPSEEK_API_KEY from https://platform.deepseek.com
  #- name: deepseek

  # Local Ollama: no key needed, never rate limited. Uncomment when you run
  # Ollama on the same machine; set OLLAMA_BASE_URL for a remote one.
  #- name: ollama

# ---------------------------------------------------------------------------
# Prompts and vision
# ---------------------------------------------------------------------------

# Extra instructions prepended to the system prompt. The bot always adds the
# response persona (plain text, no Markdown, short answers) and the language.
assistant_prompt: |
  Read the entire conversation history line by line before answering.
  You are Assistant.

# Replace the built-in response persona. Keep it plain text: Telegram rejects
# a message whose markup does not parse.
#persona_prompt: |
#  You are a friendly and smart Telegram assistant.

# Vision is off by default: enabling it sends user images to the model.
# Groq and Gemini models in this bot can see images; OpenRouter depends on the
# model. Turn it on to use it.
vision: false
vision_prompt: Describe the image
vision_detail: low

# ---------------------------------------------------------------------------
# Telegram API
# ---------------------------------------------------------------------------
# Use a local Bot API server instead of api.telegram.org (useful for large
# files). The value must contain the two %s placeholders the library fills in
# with the token and the method name.
#telegram_api_url: http://localhost:8081/bot%s/%s

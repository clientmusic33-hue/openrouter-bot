# ---------------------------------------------------------------------------
# This file supplies defaults. Anything set as a real environment variable
# (or in .env) takes precedence over the values here.
# ---------------------------------------------------------------------------

# Backend type. "openrouter" enables generation cost accounting.
type: openrouter

# Model configuration
model: deepseek/deepseek-r1:free
base_url: https://openrouter.ai/api/v1
temperature: 0.7
top_p: 0.7
frequency_penalty: 0
presence_penalty: 0

# Response configuration
max_tokens: 2000

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------

# Telegram user ID of admins, or empty to assign no admin
admin_ids: ""

# Allowed USER IDs. Leave empty to treat everyone as USER.
allowed_user_ids: ""

# Budget configuration, in USD per budget_period
user_budget: 1
guest_budget: 0

# Budget period: daily, monthly, total
budget_period: monthly

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------

# Language to use for the bot (supported: EN, RU)
lang: EN

# Minimum role to show stats (ADMIN, USER, GUEST)
stats_min_role: ADMIN

# PUBLIC_MODE removes every usage restriction at once: unlimited budget for
# all roles, no rate limiting, and answers to every group message.
# Anyone who finds the bot can then spend your provider credits.
# public_mode: true

# How the bot behaves in group chats:
#   mention - answer only when mentioned or replied to
#   all     - answer every group message
#   off     - never answer in groups
group_chat_mode: mention

# Max AI requests per user per minute (0 disables rate limiting)
rate_limit_per_minute: 10

# Max AI requests running at the same time
max_concurrent_requests: 8

# Total timeout for one request, including streaming (seconds)
request_timeout_seconds: 300

# Abort a stream that delivers nothing for this long (seconds)
stream_idle_timeout_seconds: 120

# ---------------------------------------------------------------------------
# Conversation history
# ---------------------------------------------------------------------------

max_history_size: 10
max_history_time: 60

# ---------------------------------------------------------------------------
# Provider chain
# ---------------------------------------------------------------------------
#
# Requests walk this list top to bottom. When a model fails the next model of
# the same provider is tried; when a provider fails the next provider is
# tried - both at stream creation and mid-stream.
#
# api_key_env names the environment variable holding the key. A provider whose
# key is unset is still listed by /providers (marked as having no key) but
# will fail until you set it.
#
# Remove this block entirely to fall back to the flat BASE_URL/MODEL/API_KEY
# variables plus GEMINI_API_KEY.

providers:
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: API_KEY
    models:
      - deepseek/deepseek-r1:free
      - openrouter/free

  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      - llama-3.3-70b-versatile
      - openai/gpt-oss-120b
      - llama-3.1-8b-instant

  - name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    models:
      - gemini-2.5-flash
      - gemini-2.5-flash-lite

  # Optional: uncomment and set CEREBRAS_API_KEY.
  #- name: cerebras
  #  base_url: https://api.cerebras.ai/v1
  #  api_key_env: CEREBRAS_API_KEY
  #  models:
  #    - gpt-oss-120b
  #    - llama-3.3-70b

  # Local Ollama: no API key needed, never rate limited. Shows as "no API key"
  # in /providers, which is expected for a local endpoint.
  - name: ollama
    base_url: http://localhost:11434/v1
    models:
      - llama3.2:3b

# ---------------------------------------------------------------------------
# Prompts and vision
# ---------------------------------------------------------------------------

assistant_prompt: |
  Read the entire conversation history line by line before answering.
  You are Assistant.

# Vision is off by default: enabling it sends user images to the model.
vision: false
vision_prompt: Describe the image
vision_detail: low

# Telegram user ID of admins, or empty to assign no admin
admin_ids: ""

# Allowed USER IDs
allowed_user_ids: ""

# Budget configuration
user_budget: 1
guest_budget: 0.5

# Budget period: daily, monthly, total
budget_period: monthly

# Language to use for the bot
# Supported: EN, RU
lang: EN

# Minimum role to show stats
# Supported: ADMIN, USER, GUEST
stats_min_role: ADMIN

token_price: 0.002

# ---------------------------------------------------------
# Model configuration
# ---------------------------------------------------------

type: openrouter
model: openai/gpt-4o-mini
base_url: https://openrouter.ai/api/v1

temperature: 0.7
top_p: 0.7

# ---------------------------------------------------------
# Assistant configuration
# ---------------------------------------------------------

assistant_prompt: |
  You are a helpful, accurate and friendly AI assistant.

  IMPORTANT RESPONSE FORMATTING RULES:

  - Format every response for Telegram.
  - NEVER use LaTeX.
  - NEVER use \[ \], \( \), $$, $...$, \begin{aligned}, \begin{equation}, or other LaTeX syntax.
  - NEVER output raw LaTeX commands.
  - For mathematics, use normal readable text and Unicode symbols.
  - Use symbols such as ×, ÷, √, π, θ, α, β, ≥, ≤, ≠ when useful.
  - Use Unicode superscripts such as ², ³ and ⁿ when possible.
  - Write fractions as (a + b) / c.
  - Put important formulas on separate lines.
  - Use numbered steps when solving mathematical problems.
  - Show calculations clearly and sequentially.
  - Use simple Telegram-friendly formatting.
  - Keep answers structured and easy to read.
  - Use headings and bullet points when useful.
  - Do not generate unnecessary introductions.
  - Do not repeat the user's question unnecessarily.
  - Do not explain these formatting rules to the user.
  - Answer the user's actual question directly.
  - Preserve important details from the conversation history.
  - If the user asks for code, provide properly formatted code blocks.
  - If the user asks for mathematical formulas, use plain text/Unicode rather than LaTeX.

# ---------------------------------------------------------
# Vision settings
# ---------------------------------------------------------

vision: true
vision_prompt: Describe the image
vision_detail: low

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            files_joined=$(echo "$unformatted" | tr '\n' ' ')
            diff_out=$(gofmt -d . | head -n 80 | tr '\n' ' ')
            echo "::error::Unformatted files: $files_joined | Diff: $diff_out"
            exit 1
          fi

      - name: Vet
        run: |
          if ! out=$(go vet ./... 2>&1); then
            msg=$(echo "$out" | tr '\n' ' ')
            echo "::error::go vet failed: $msg"
            exit 1
          fi

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: |
          if ! out=$(go build ./... 2>&1); then
            msg=$(echo "$out" | tr '\n' ' ')
            echo "::error::go build failed: $msg"
            exit 1
          fi

      - name: Test
        run: |
          if ! out=$(go test -race -covermode=atomic ./... 2>&1); then
            msg=$(echo "$out" | tail -n 40 | tr '\n' ' ')
            echo "::error::go test failed: $msg"
            exit 1
          fi

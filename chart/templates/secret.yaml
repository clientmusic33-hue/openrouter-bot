apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}

type: Opaque

stringData:
  API_KEY: {{ required "secrets.API_KEY is required" .Values.secrets.API_KEY | quote }}
  TELEGRAM_BOT_TOKEN: {{ required "secrets.TELEGRAM_BOT_TOKEN is required" .Values.secrets.TELEGRAM_BOT_TOKEN | quote }}
  {{- if .Values.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.geminiApiKey | quote }}
  {{- end }}

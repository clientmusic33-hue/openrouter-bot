apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}

type: Opaque

stringData:
  API_KEY: {{ required "secrets.API_KEY is required" .Values.secrets.API_KEY | quote }}
  TELEGRAM_BOT_TOKEN: {{ required "secrets.TELEGRAM_BOT_TOKEN is required" .Values.secrets.TELEGRAM_BOT_TOKEN | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{- if and $value (ne $key "API_KEY") (ne $key "TELEGRAM_BOT_TOKEN") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

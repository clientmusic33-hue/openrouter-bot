# Deployment
#
# Keep this at 1: the bot reads updates with long polling, and Telegram hands
# each update to a single poller. A second replica would answer only part of
# the traffic, and the two pods would fight over the same state files.
replicaCount: 1

image:
  repository: openrouter-bot
  tag: "latest"
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secrets - rendered into a Kubernetes Secret, never a ConfigMap.
# Prefer supplying these with --set or an external secret manager instead of
# committing real values here.
# ---------------------------------------------------------------------------
secrets:
  API_KEY: "sk-or-v1-XXX"
  TELEGRAM_BOT_TOKEN: "7777777777:XXX"
  # Every extra provider key joins the failover chain automatically.
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  CEREBRAS_API_KEY: ""
  NVIDIA_API_KEY: ""
  SAMBANOVA_API_KEY: ""

# ---------------------------------------------------------------------------
# Non-sensitive configuration - rendered into a ConfigMap.
# ---------------------------------------------------------------------------
config:
  ADMIN_IDS: "7777777777"
  ALLOWED_USER_IDS: "7777777777,8888888888"
  BASE_URL: https://openrouter.ai/api/v1
  MODEL: deepseek/deepseek-r1:free
  VISION: "false"
  MAX_HISTORY_SIZE: "20"
  MAX_HISTORY_TIME: "60"
  MAX_TOKENS: "2000"
  USER_BUDGET: "1"
  GUEST_BUDGET: "0"
  BUDGET_PERIOD: monthly
  LANG: EN
  STATS_MIN_ROLE: ADMIN
  GROUP_CHAT_MODE: mention
  RATE_LIMIT_PER_MINUTE: "10"
  MAX_CONCURRENT_REQUESTS: "8"
  REQUEST_TIMEOUT_SECONDS: "300"
  STREAM_IDLE_TIMEOUT_SECONDS: "120"
  MAX_REPLY_CHARS: "3500"
  RENDER_MARKDOWN: "false"
  SUGGEST_MODELS: "true"
  # Who may use the bot in a group: everyone, admins or owner.
  GROUP_ACCESS: everyone
  # Who may use the bot in a direct message. PUBLIC_MODE forces everyone.
  PRIVATE_ACCESS: everyone
  # Per-user preferences, favourites and spend. Lives on the persistent volume
  # so a restart does not wipe them (persistence.enabled must be true).
  LOGS_DIR: /openrouter-bot/data/logs
  # true = no budgets, no rate limiting, answers every group message
  PUBLIC_MODE: "false"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Probes now hit the real /healthz endpoint instead of pgrep-ing the process.
probes:
  path: /healthz
  port: 10000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Persist user state: per-chat settings in data/ and per-user preferences,
# favourites and spend in logs/. Both directories have to survive a restart,
# otherwise every user loses their pinned model and their usage history.
persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""
  mountPath: /openrouter-bot/data
